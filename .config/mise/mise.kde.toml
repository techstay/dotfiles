# KDE Plasma 6 Desktop Environment Configuration
# Activated when MISE_ENV includes "kde"

[dotfiles]
# KWin window manager, desktop effects, tiling layout, and scaling
"~/.config/kwinrc" = "~/.dotfiles/.config/kde/kwinrc"

# Global keyboard shortcuts
"~/.config/kglobalshortcutsrc" = "~/.dotfiles/.config/kde/kglobalshortcutsrc"

[tasks."fcitx5:restart"]
description = "Cleanly restart Fcitx5 via KWin Wayland Launcher"
run = """
killall fcitx5 2>/dev/null || true
sleep 1
kwriteconfig6 --file kwinrc --group Wayland --key InputMethod --notify ""
sleep 1
kwriteconfig6 --file kwinrc --group Wayland --key InputMethod --notify "/usr/share/applications/fcitx5-wayland-launcher.desktop"
echo "Fcitx5 Wayland launcher reloaded."
"""
