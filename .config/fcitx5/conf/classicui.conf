# 垂直候选列表
Vertical Candidate List=False
# 使用按屏幕 DPI
PerScreenDPI=True
# 使用鼠标滚轮翻页
WheelForPaging=True
# 字体（调大输入法字体）
Font="MiSans 16"
# 菜单字体
MenuFont="MiSans 14"
# 托盘字体
TrayFont="MiSans Bold 10"
# 托盘文字轮廓颜色
TrayOutlineColor=#000000
# 托盘文字颜色
TrayTextColor=#ffffff
# 优先使用文字图标
PreferTextIcon=False
# 显示预编辑文本
ShowLayoutNameInIcon=True
# 使用输入法的语言来显示文字
UseInputMethodLangaugeToDisplayText=True
# 主题配置（碧月青）
Theme=mint-dark-green
DarkTheme=mint-dark-green
